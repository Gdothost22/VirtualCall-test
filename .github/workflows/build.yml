name: Build Mac Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build via Xcode
      run: |
        cd Builds/MacOSX
        xcodebuild -scheme "VirtualCall-test - Standalone Plugin" -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VirtualCall-test-Binary
        path: Builds/MacOSX/build/Release/
