name: Build JUCE Plugin

on:
  push:
    branches: [ "main" ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download and Extract JUCE Framework
      run: |
        mkdir -p ~/Downloads
        curl -L https://github.com/juce-framework/JUCE/archive/refs/tags/7.0.9.zip -o juce.zip
        unzip -q juce.zip
        mv JUCE-7.0.9 ~/Downloads/JUCE

    - name: Verify JUCE Modules Path Exists
      run: |
        ls -la ~/Downloads/JUCE/modules

    - name: Generate Xcode Project via Projucer
      run: |
        cd $HOME/Downloads/JUCE/extras/Projucer/Builds/MacOSX
        xcodebuild -configuration Release
        PROJUCER_BIN="$HOME/Downloads/JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
        
        cd $GITHUB_WORKSPACE
        JUCER_FILE=$(find . -name "*.jucer" -maxdepth 2)
        echo "Found jucer file at: $JUCER_FILE"
        $PROJUCER_BIN --resave "$JUCER_FILE"

    - name: Build via Xcode
      run: |
        cd Builds/MacOSX
        xcodebuild -scheme "VirtualCall-test - Standalone Plugin" -configuration Release build
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VirtualCall-test-Binary
        path: Builds/MacOSX/build/Release/
